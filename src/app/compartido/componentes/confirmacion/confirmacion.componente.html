
<p-confirmdialog
    key="confirmacion-global"
    styleClass="dialogo-confirmacion"
    [closable]="false"
    [closeOnEscape]="true"
    [dismissableMask]="false"
    [breakpoints]="{
        '640px': 'calc(100vw - 2rem)'
    }"
>
    <ng-template
        #headless
        let-message
        let-onAccept="onAccept"
        let-onReject="onReject"
    >
        <div
            class="confirmacion-contenido relative flex w-full flex-col items-center rounded-md bg-ds-surface px-8 pb-8 pt-20 text-center max-[480px]:px-5 max-[480px]:pb-6"
        >
            <!-- Icono -->
            <div
                class="confirmacion-icono absolute -top-16 left-1/2 flex size-30 -translate-x-1/2 items-center justify-center rounded-full text-ds-on-primary"
                [class]="obtenerClaseIcono(message.acceptButtonProps?.tipo)"
            >
                <svg
                    size="40"
                    [pIcon]="obtenerIcono(message.acceptButtonProps?.tipo)"
                ></svg>
            </div>

            <!-- Título -->
            <h2 class="confirmacion-titulo mb-3 text-lg font-semibold leading-[26px] text-ds-ink">
                {{ message.header }}
            </h2>
            <!-- Mensaje -->
            <p class="confirmacion-mensaje whitespace-pre-line text-sm leading-[22px] text-ds-muted">
                {{ message.message }}
            </p>

            <!-- Acciones -->
            <div class="confirmacion-acciones mt-10 flex w-full gap-3 max-[480px]:mt-8">

                <button
                    type="button"
                    pButton
                    (click)="onAccept()"
                >
                    {{ message.acceptLabel || 'Aceptar' }}
                </button>

                <button
                    type="button"
                    pButton
                    variant="outlined"
                    (click)="onReject()"
                >
                    {{ message.rejectLabel || 'Cancelar' }}
                </button>

            </div>

        </div>
    </ng-template>
</p-confirmdialog>
