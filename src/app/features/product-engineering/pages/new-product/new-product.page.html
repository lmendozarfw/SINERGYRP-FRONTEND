<div class="ds-new-product-page">
    <section class="ds-new-product-heading">
        <div class="min-w-0">
            <h2 class="ds-title-page mt-1">{{ encabezado.titulo }}</h2>
            <p class="ds-body mt-1 max-w-2xl text-[var(--ds-text-muted)]">
                {{ encabezado.descripcion }}
            </p>
        </div>
    </section>

    <app-asistente-pasos
        [pasos]="pasos"
        [(pasoActivo)]="pasoActual"
        [permitirNavegacionLibre]="false"
        (pasoCambiado)="alCambiarPaso($event)"
    />

    <section class="ds-new-product-step">
        @switch (pasoActual) {
            @case (1) {
                <app-datos-generales />
            }
            @case (2) {
                <app-corridas-equivalencias />
            }
            @case (3) {
                <app-piezas-consumos />
            }
            @case (4) {
                <app-combinaciones />
            }
            @case (5) {
                <app-revision-liberacion />
            }
        }
    </section>

    <app-asistente-pasos-acciones
        [pasoActual]="pasoActual"
        [totalPasos]="pasos.length"
        [siguientePaso]="siguientePaso"
        [puedeRegresar]="puedeRegresar"
        [esUltimoPaso]="esUltimoPaso"
        (regresar)="alRegresar()"
        (continuar)="alContinuar()"
        (guardarBorrador)="guardarBorrador()"
    />
</div>
