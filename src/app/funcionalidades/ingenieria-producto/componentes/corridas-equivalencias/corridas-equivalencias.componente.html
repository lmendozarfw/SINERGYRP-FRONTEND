<div class="flex flex-col gap-6">
  <app-tarjeta titulo="Configuración de la corrida"
    descripcion="Define la corrida, el sistema principal y la talla base de desarrollo."
    icono="sitemap">
    <form
      class="grid grid-cols-3 gap-4 max-[1023px]:grid-cols-1"
      [formGroup]="formularioCorrida"
      (submit)="$event.preventDefault()"
    >
      <div class="ds-field">
        <app-etiqueta-formulario para="corrida" obligatorio>Corrida</app-etiqueta-formulario>
        <p-select
          class="ds-select"
          inputId="corrida"
          formControlName="corrida"
          [options]="corridas"
          optionLabel="etiqueta"
          optionValue="valor"
          [fluid]="true"
        />
        <app-mensaje-ayuda-error mensajeAyuda="Rango de tallas que se fabricará para el modelo."></app-mensaje-ayuda-error>
      </div>

      <div class="ds-field">
        <app-etiqueta-formulario para="sistema-principal" obligatorio>Sistema principal</app-etiqueta-formulario>
        <p-select
          class="ds-select"
          inputId="sistema-principal"
          formControlName="sistemaPrincipal"
          [options]="sistemas"
          optionLabel="nombre"
          optionValue="clave"
          [fluid]="true"
        />
        <app-mensaje-ayuda-error mensajeAyuda="Sistema usado como referencia para las equivalencias."></app-mensaje-ayuda-error>
      </div>

      <div class="ds-field">
        <app-etiqueta-formulario para="talla-base" obligatorio>Talla base de desarrollo</app-etiqueta-formulario>
        <p-select
          class="ds-select"
          inputId="talla-base"
          formControlName="tallaBase"
          [options]="opcionesTallaBase"
          optionLabel="etiqueta"
          optionValue="valor"
          [fluid]="true"
        />
        <app-mensaje-ayuda-error mensajeAyuda="Talla sobre la que se desarrolla la horma del modelo."></app-mensaje-ayuda-error>
      </div>
    </form>
  </app-tarjeta>

  <app-tabla-equivalencias
    [sistemas]="sistemas"
    [tallas]="tallas()"
    [sistemaPrincipal]="sistemaPrincipal"
    [tallaBaseId]="tallaBaseId"
  />
</div>
