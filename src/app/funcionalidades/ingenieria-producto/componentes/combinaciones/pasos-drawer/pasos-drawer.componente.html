<div class="border-b border-ds-line bg-ds-surface px-6 py-5">
  <p-stepper class="w-full!" [value]="pasoActivo()" (valueChange)="alCambiarValor($event)">
    <p-step-list class="flex! w-full! items-start! [&_.p-stepper-separator]:hidden!">
      @for (paso of pasosConEstado(); track paso.id) {
        <p-step class="min-w-0! items-start! gap-0! p-0! last:flex-none!" [value]="paso.id">
          <ng-template #content>
            <div class="flex flex-col flex-auto">
              <div class="flex flex-1 items-center">
                <button
                  type="button"
                  class="flex shrink-0 cursor-pointer items-center justify-center rounded-full border-0 bg-ds-primary-soft p-0 disabled:cursor-not-allowed"
                  [disabled]="!puedeSeleccionar(paso)"
                  [attr.aria-current]="pasoActivo() === paso.id ? 'step' : null"
                  (click)="irA(paso)"
                >
                  <span
                    class="flex size-7 min-w-7 items-center justify-center rounded-full border-2 text-xs font-semibold transition-colors duration-200"
                    [class.border-ds-primary]="pasoActivo() === paso.id || (estaCompletado(paso.id) && pasoActivo() !== paso.id)"
                    [class.bg-ds-primary]="pasoActivo() === paso.id || (estaCompletado(paso.id) && pasoActivo() !== paso.id)"
                    [class.text-ds-on-primary]="pasoActivo() === paso.id || (estaCompletado(paso.id) && pasoActivo() !== paso.id)"
                    [class.border-ds-line]="paso.bloqueado && pasoActivo() !== paso.id && !estaCompletado(paso.id)"
                    [class.bg-ds-canvas-strong]="paso.bloqueado && pasoActivo() !== paso.id && !estaCompletado(paso.id)"
                    [class.text-ds-ink-soft]="paso.bloqueado && pasoActivo() !== paso.id && !estaCompletado(paso.id)"
                    [class.border-transparent]="!paso.bloqueado && pasoActivo() !== paso.id && !estaCompletado(paso.id)"
                  >
                    @if (estaCompletado(paso.id) && pasoActivo() !== paso.id) {
                      <svg pIcon="check" [size]="14"></svg>
                    } @else if (paso.bloqueado) {
                      <svg pIcon="lock" [size]="14"></svg>
                    } @else {
                      {{ paso.id }}
                    }
                  </span>
                </button>
                @if (!$last) {
                  <span
                    class="my-2 h-0.5 flex-1 rounded-full transition-colors duration-200"
                    [class.bg-ds-line]="!estaCompletado(paso.id)"
                    [class.bg-ds-primary]="estaCompletado(paso.id)"
                  ></span>
                }
              </div>
              <div class="flex min-w-0 shrink-0 flex-col gap-0.5">
                <span
                  class="text-xs font-semibold leading-4 whitespace-nowrap transition-colors duration-200 max-sm:text-[11px]"
                  [class.text-ds-muted]="pasoActivo() !== paso.id && !paso.bloqueado"
                  [class.text-ds-primary]="pasoActivo() === paso.id"
                  [class.text-ds-ink-soft]="paso.bloqueado && pasoActivo() !== paso.id"
                >
                  {{ paso.titulo }}
                </span>
                <span class="text-[10px] leading-[14px] whitespace-nowrap text-ds-ink-soft max-sm:hidden">{{ paso.descripcion }}</span>
              </div>
            </div>
          </ng-template>
        </p-step>
      }
    </p-step-list>
  </p-stepper>
</div>
