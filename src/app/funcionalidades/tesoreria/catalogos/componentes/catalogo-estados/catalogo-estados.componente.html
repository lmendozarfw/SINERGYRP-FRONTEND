<div class="overflow-x-auto rounded-lg border border-ds-line bg-ds-surface">
    <p-table [value]="filas()" dataKey="id" [unstyled]="true"
        tableStyleClass="w-full min-w-[760px] border-collapse text-sm">
        <ng-template #header>
            <tr class="border-b border-ds-line bg-ds-canvas-strong">
                <th class="px-4 py-3 align-middle text-left w-[200px] min-w-[200px]">
                    <span class="block text-xs font-semibold tracking-wide text-ds-muted uppercase">Código de país</span>
                    <span class="mt-0.5 block text-[11px] font-normal text-ds-ink-soft normal-case">Ej. MX</span>
                </th>
                <th class="px-4 py-3 align-middle text-left w-[200px] min-w-[200px]">
                    <span class="block text-xs font-semibold tracking-wide text-ds-muted uppercase">Código de estado</span>
                    <span class="mt-0.5 block text-[11px] font-normal text-ds-ink-soft normal-case">Ej. GTO</span>
                </th>
                <th class="px-4 py-3 align-middle text-left w-[200px] min-w-[200px]">
                    <span class="block text-xs font-semibold tracking-wide text-ds-muted uppercase">Nombre</span>
                    <span class="mt-0.5 block text-[11px] font-normal text-ds-ink-soft normal-case">Ej. Guanajuato</span>
                </th>
                <th class="w-[190px] px-4 py-3 align-middle text-right w-[200px] min-w-[200px]">
                    <span class="block text-xs font-semibold tracking-wide text-ds-muted uppercase">Acciones</span>
                    <span class="mt-0.5 block text-[11px] font-normal text-ds-ink-soft normal-case">Guarda o elimina</span>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-fila>
            @if (fila.esNueva) {
            <tr class="border-b border-ds-line bg-ds-canvas-strong">
                <td class="h-[60px] px-4 py-3 align-middle">
                    <p-select [formField]="fila.formulario.idPais"
                            [class.p-invalid]="idPaisError.errorVisible()" fluid 
                            [options]="paises" optionLabel="label" optionValue="value"
                            placeholder="Selecciona un país" />
                    <app-mensaje-ayuda-error #idPaisError
                        [campo]="fila.formulario.idPais"></app-mensaje-ayuda-error>
                </td>
                <td class="h-[60px] px-4 py-3 align-middle">
                    <input pInputText [formField]="fila.formulario.codigoEstado"
                        [class.p-invalid]="codigoEstadoError.errorVisible()" type="text" placeholder="Ej. GTO" fluid />
                    <app-mensaje-ayuda-error #codigoEstadoError
                        [campo]="fila.formulario.codigoEstado"></app-mensaje-ayuda-error>
                </td>
                <td class="h-[60px] px-4 py-3 align-middle">
                    <input pInputText [formField]="fila.formulario.nombre"
                        [class.p-invalid]="nombreError.errorVisible()" type="text" placeholder="Ej. Guanajuato" fluid />
                    <app-mensaje-ayuda-error #nombreError [campo]="fila.formulario.nombre"></app-mensaje-ayuda-error>
                </td>
                <td class="h-[60px] px-4 py-3 align-middle text-right">
                    <div class="flex items-center justify-end gap-2">
                        <button pButton type="button" fluid>Guardar estado</button>
                    </div>
                </td>
            </tr>
            } @else {
            <tr class="border-b border-ds-line transition-colors last:border-b-0 hover:bg-ds-canvas">
                <td [pEditableColumn]="fila" pEditableColumnField="idPais"
                    class="h-[60px] cursor-text px-4 py-3 align-middle">
                    <p-cell-editor>
                        <ng-template #input>
                            <p-select [formField]="fila.formulario.idPais"
                            [class.p-invalid]="idPaisEdicionError.errorVisible()" fluid 
                            [options]="paises" optionLabel="label" optionValue="value"
                            placeholder="Selecciona un país" />
                            <app-mensaje-ayuda-error #idPaisEdicionError
                                [campo]="fila.formulario.idPais"></app-mensaje-ayuda-error>
                        </ng-template>
                        <ng-template #output>
                            <span class="font-medium text-ds-ink">{{ fila.formulario.idPais().value() }}</span>
                        </ng-template>
                    </p-cell-editor>
                </td>
                <td [pEditableColumn]="fila" pEditableColumnField="codigoEstado"
                    class="h-[60px] cursor-text px-4 py-3 align-middle">
                    <p-cell-editor>
                        <ng-template #input>
                            <input pInputText [formField]="fila.formulario.codigoEstado"
                                [class.p-invalid]="codigoEstadoEdicionError.errorVisible()" type="text" fluid />
                            <app-mensaje-ayuda-error #codigoEstadoEdicionError
                                [campo]="fila.formulario.codigoEstado"></app-mensaje-ayuda-error>
                        </ng-template>
                        <ng-template #output>
                            <span class="text-ds-ink-soft">{{ fila.formulario.codigoEstado().value() }}</span>
                        </ng-template>
                    </p-cell-editor>
                </td>
                <td [pEditableColumn]="fila" pEditableColumnField="nombre"
                    class="h-[60px] cursor-text px-4 py-3 align-middle">
                    <p-cell-editor>
                        <ng-template #input>
                            <input pInputText [formField]="fila.formulario.nombre"
                                [class.p-invalid]="nombreEdicionError.errorVisible()" type="text" fluid />
                            <app-mensaje-ayuda-error #nombreEdicionError
                                [campo]="fila.formulario.nombre"></app-mensaje-ayuda-error>
                        </ng-template>
                        <ng-template #output>
                            <span class="text-ds-ink">{{ fila.formulario.nombre().value() }}</span>
                        </ng-template>
                    </p-cell-editor>
                </td>
                <td class="h-[60px] px-4 py-3 align-middle text-right">
                    <div class="flex justify-end gap-1">
                        <button type="button"
                            class="inline-flex size-8 cursor-pointer items-center justify-center rounded-md border border-transparent bg-transparent text-ds-muted transition-colors hover:border-ds-primary-soft hover:bg-ds-primary-soft hover:text-ds-primary focus-visible:shadow-ds-focus focus-visible:outline-none"
                            [attr.aria-label]="'Guardar cambios de ' + fila.idPais">
                            <svg pIcon="check" [size]="15"></svg>
                        </button>
                        <button type="button"
                            class="inline-flex size-8 cursor-pointer items-center justify-center rounded-md border border-transparent bg-transparent text-ds-muted transition-colors hover:border-ds-danger-line hover:bg-ds-danger-soft hover:text-ds-danger focus-visible:shadow-ds-focus focus-visible:outline-none"
                            [attr.aria-label]="'Eliminar ' + fila.idPais">
                            <svg pIcon="trash" [size]="15"></svg>
                        </button>
                    </div>
                </td>
            </tr>
            }
        </ng-template>
    </p-table>

    @if (!estados().length) {
    <div class="border-t border-ds-line p-4">
        <app-catalogo-vacio titulo="estados" descripcion="Usa la primera fila para agregar un registro." />
    </div>
    }
</div>
