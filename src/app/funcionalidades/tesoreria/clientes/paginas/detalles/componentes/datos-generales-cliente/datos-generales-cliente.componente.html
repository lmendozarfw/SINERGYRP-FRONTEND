<form class="ds-form flex flex-col gap-7 p-6" (submit)="$event.preventDefault(); guardar()">
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div class="ds-field">
      <app-etiqueta-formulario para="codigo" [obligatorio]="true">Código</app-etiqueta-formulario>
      <input id="codigo" pInputText [formField]="formulario.codigo" [invalid]="codigoError.errorVisible()" type="text" class="ds-input" placeholder="Ej. CLI-001" />
      <app-mensaje-ayuda-error #codigoError [campo]="formulario.codigo"></app-mensaje-ayuda-error>
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="estado" [obligatorio]="true">Estado del cliente</app-etiqueta-formulario>
      <p-select appendTo="body" inputId="estado" [formField]="formulario.estadoCliente" [invalid]="estadoError.errorVisible()" class="w-full" [options]="opcionesEstado" optionLabel="etiqueta" optionValue="valor" placeholder="Selecciona una opción" />
      <app-mensaje-ayuda-error #estadoError [campo]="formulario.estadoCliente"></app-mensaje-ayuda-error>
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="razon-social" [obligatorio]="true">Nombre o razón social</app-etiqueta-formulario>
      <input id="razon-social" pInputText [formField]="formulario.nombreRazonSocial" [invalid]="razonSocialError.errorVisible()" type="text" class="ds-input" placeholder="Ej. Grupo Industrial Raudal, S.A. de C.V." />
      <app-mensaje-ayuda-error #razonSocialError [campo]="formulario.nombreRazonSocial"></app-mensaje-ayuda-error>
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="nombre-comercial">Nombre comercial</app-etiqueta-formulario>
      <input id="nombre-comercial" pInputText [formField]="formulario.nombreComercial" type="text" class="ds-input" placeholder="Ej. Raudal" />
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="tipo-persona" [obligatorio]="true">Tipo de persona</app-etiqueta-formulario>
      <p-select appendTo="body" inputId="tipo-persona" [formField]="formulario.tipoPersona" [invalid]="tipoPersonaError.errorVisible()" [options]="opcionesTipoPersona" optionLabel="etiqueta" optionValue="valor" placeholder="Selecciona una opción" />
      <app-mensaje-ayuda-error #tipoPersonaError [campo]="formulario.tipoPersona"></app-mensaje-ayuda-error>
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="rfc" [obligatorio]="true">RFC</app-etiqueta-formulario>
      <input id="rfc" pInputText [formField]="formulario.rfc" [invalid]="rfcError.errorVisible()" type="text" class="ds-input uppercase" placeholder="Ej. RIR240315AB1" />
      <app-mensaje-ayuda-error #rfcError [campo]="formulario.rfc" mensajeAyuda="Registro Federal de Contribuyentes."></app-mensaje-ayuda-error>
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="identificador-fiscal">Identificador fiscal extranjero</app-etiqueta-formulario>
      <input id="identificador-fiscal" pInputText [formField]="formulario.identificadorFiscalExtranjero" type="text" class="ds-input" placeholder="Ej. IDF-44710" />
    </div>
    <div class="ds-field">
      <app-etiqueta-formulario para="fecha-alta">Fecha de alta</app-etiqueta-formulario>
      <p-datepicker id="fecha-alta" appendTo="body" [formField]="formulario.fechaAlta" dateFormat="dd/mm/yy"
                            [showIcon]="true" fluid />
    </div>
  </div>
  <div class="flex justify-end">
    <button pButton type="submit">Guardar datos generales</button>
  </div>
</form>
